name: Windows recovery EXE acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'requirements*'
      - 'tools/verify_windows_recovery.py'
      - '.github/workflows/windows-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-exe:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real native dependencies and packager
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-binary=twofish -r requirements.txt 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          exit $LASTEXITCODE
      - name: Build and run private synthetic recovery executables
        shell: pwsh
        run: |
          .venv/Scripts/python tools/verify_windows_recovery.py --report acceptance-results/windows-recovery.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-recovery-results
          path: acceptance-results/windows-recovery.json
          if-no-files-found: warn
