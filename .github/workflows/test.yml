name: Tests

on:
  push:
    branches: [main, master, develop, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.10'}
          - {os: ubuntu-22.04, python: '3.11'}
          - {os: ubuntu-22.04, python: '3.12'}
          - {os: windows-2022, python: '3.12'}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux native build and Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libegl1 libopengl0
      - name: Create test environment and build native Twofish
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip setuptools wheel
          "$PY" -m pip install --no-binary=twofish -r requirements.txt
          "$PY" -m pip check
          "$PY" -c "from src.crypto.twofish_backend import Twofish; import nacl.secret; from PyQt6 import QtWidgets; assert Twofish(bytes(16)).encrypt(bytes(16)).hex() == '9f589f5cf6122c32b6bfec2f2ae8c35a'"
      - name: Full suite once, including real Qt widget tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" tools/dev.py test -- -rs --junitxml=test-results.xml --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install flake8
      - run: .venv/bin/python -m flake8 src/ cli/ gui/ tools/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
